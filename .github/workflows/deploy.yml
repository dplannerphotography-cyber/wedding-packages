# Builds the Eleventy site and publishes it to GitHub Pages.
# Only runs for the main branch. It has no effect until the repository's
# Pages source is switched to "GitHub Actions" (Settings > Pages).
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "dplanner.com.ng",
              "key": "c4d372e5192842bb90f75a6104eb6a58",
              "keyLocation": "https://dplanner.com.ng/c4d372e5192842bb90f75a6104eb6a58.txt",
              "urlList": [
                "https://dplanner.com.ng/",
                "https://dplanner.com.ng/weddings/",
                "https://dplanner.com.ng/weddings/essential/",
                "https://dplanner.com.ng/weddings/classic/",
                "https://dplanner.com.ng/weddings/signature/",
                "https://dplanner.com.ng/weddings/album-addon/",
                "https://dplanner.com.ng/photography/",
                "https://dplanner.com.ng/blog/",
                "https://dplanner.com.ng/blog/how-much-does-wedding-photography-cost-in-ibadan-2026/",
                "https://dplanner.com.ng/blog/how-to-choose-a-wedding-photographer-in-ibadan-10-questions/",
                "https://dplanner.com.ng/blog/traditional-engagement-photography-in-oyo-state-what-to-expect/",
                "https://dplanner.com.ng/sitemap.xml",
                "https://dplanner.com.ng/llms.txt",
                "https://dplanner.com.ng/llms-full.txt"
              ]
            }'
