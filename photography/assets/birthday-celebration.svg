<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bdayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcf6ed"/>
      <stop offset="60%" stop-color="#f5e8d4"/>
      <stop offset="100%" stop-color="#eed8be"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bdayGrad)"/>
  
  <!-- Subtle Celebration Motif -->
  <circle cx="400" cy="380" r="170" fill="none" stroke="#b88628" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="400" cy="380" r="220" fill="none" stroke="#6e1628" stroke-width="1" opacity="0.2"/>
  
  <!-- Sparkles & Bokeh Rings -->
  <circle cx="280" cy="260" r="18" fill="#b88628" opacity="0.15"/>
  <circle cx="530" cy="290" r="24" fill="#6e1628" opacity="0.12"/>
  <circle cx="320" cy="480" r="14" fill="#b88628" opacity="0.18"/>
  <circle cx="490" cy="460" r="20" fill="#6e1628" opacity="0.14"/>
  
  <!-- Stylized Camera Focus Icon -->
  <g transform="translate(400, 380)" stroke="#6e1628" stroke-width="2" fill="none" opacity="0.45">
    <rect x="-42" y="-30" width="84" height="60" rx="6"/>
    <circle r="18"/>
    <circle cx="24" cy="-14" r="3" fill="#6e1628"/>
  </g>

  <!-- Typography overlay -->
  <rect x="140" y="810" width="520" height="90" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="400" y="848" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="700" fill="#171514" text-anchor="middle" letter-spacing="2">BIRTHDAY &amp; MILESTONE</text>
  <text x="400" y="878" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#6e1628" text-anchor="middle" letter-spacing="1">STUDIO &amp; OUTDOOR CELEBRATIONS</text>
</svg>
