      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="60%" stop-color="#e8e8ed"/>
      <stop offset="100%" stop-color="#d6d6df"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#corpGrad)"/>
  
  <!-- Architectural / Conference Lines -->
  <line x1="120" y1="200" x2="680" y2="200" stroke="#6e1628" stroke-width="1.5" opacity="0.2"/>
  <line x1="120" y1="560" x2="680" y2="560" stroke="#6e1628" stroke-width="1.5" opacity="0.2"/>
  
  <rect x="220" y="240" width="360" height="280" rx="8" fill="none" stroke="#171514" stroke-width="1.5" opacity="0.25"/>
