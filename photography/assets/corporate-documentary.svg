  <text x="400" y="848" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="700" fill="#171514" text-anchor="middle" letter-spacing="2">CORPORATE &amp; EVENTS</text>
  <text x="400" y="878" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#6e1628" text-anchor="middle" letter-spacing="1">AGMS • CONFERENCES • SEMINARS</text>
